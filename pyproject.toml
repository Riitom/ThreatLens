[project]
name = "threatlens"
version = "1.0.1"
description = "Explainable phishing detection, web security assessment, certificate inspection, and community threat intelligence."
requires-python = ">=3.13"
dependencies = ["flask>=3.1,<4", "requests>=2.32,<3", "cryptography>=44,<49"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["threatlens*", "api*"]

[tool.setuptools.package-data]
threatlens = ["static/*", "data/*"]

[tool.vercel]
entrypoint = "api.index:app"
